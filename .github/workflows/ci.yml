name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:ts
      - run: npm run format:check:ts
      - run: npm run typecheck:ts
      - run: npm run test:ts
      - run: npm run build:packages
      - run: npm run build:desktop

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./apps/api[dev]
      - run: npm --version
      - run: python -m ruff check apps/api
      - run: python -m ruff format --check apps/api
      - run: python -m mypy apps/api/app
      - run: python -m pytest apps/api/tests
      - run: python -m compileall apps/api/app
